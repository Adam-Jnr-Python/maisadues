<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="./css/dashboard.css" />
  </head>
  <body>
    <div class="container">
      <!-- SIDEBAR -->
      <div class="sidebar">
        <div class="sidebar-head">
          <h2 class="head-intro">MaISA</h2>
          <img
            src="./images/maisa-icon.jpg"
            alt="MaISA logo"
            class="maisa-logo" />
        </div>
        <hr />

        <ul>
          <li class="active" onclick="window.location.href = 'dashboard.html'">
            Dashboard
          </li>
          <li onclick="window.location.href = 'set-dues.html'">Set-Dues</li>
          <li onclick="window.location.href = 'students.html'">Students</li>
          <li id="logoutBtn">Logout</li>
        </ul>
      </div>

      <!-- MAIN CONTENT -->
      <div class="main">
        <!-- HEADER -->
        <div class="header">
          <h1>Dashboard</h1>
        </div>

        <!-- CARDS -->
        <div class="cards">
          <div class="card">
            <h3>Total Students</h3>
            <p id="totalStudents">0</p>
          </div>
          <div class="card">
            <h3>Fully Paid</h3>
            <p id="totalPaid">0</p>
          </div>
          <div class="card">
            <h3>Total Money Received</h3>
            <p id="totalMoney">GH¢0</p>
          </div>
          <div class="card">
            <h3>Students Owing</h3>
            <p id="owing">0</p>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/dashboard.js"></script>
  </body>
</html>
